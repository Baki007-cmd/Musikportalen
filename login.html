<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logga in | Musikportalen</title><link rel="stylesheet" href="style.css"><style>main{max-width:560px;margin:3rem auto;padding:1rem}label{display:block;margin:1rem 0 .3rem}input{display:block;width:100%;padding:.8rem;box-sizing:border-box;border:1px solid #94a3b8;border-radius:8px}button{margin-top:1rem}.error{color:#9f1239}</style></head>
<body><header><div class="wrap top"><div class="brand">♫ Musikportalen <small>Inloggning för lärare</small></div><a href="index.html" style="color:white">Startsida</a></div></header>
<main><section class="panel"><h1>Logga in</h1><p>För dig som har ett testkonto i Musikportalen. Använd e-postadress och lösenord från Supabase.</p><form id="form"><label for="email">E-postadress</label><input id="email" type="email" autocomplete="email" required><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="submit">Logga in</button></form><p id="status" role="status" aria-live="polite"></p><p>Har du fått ett konto men saknar lösenord? <button type="button" id="reset" class="secondary">Skicka återställningslänk</button></p><p class="note">Endast testuppgifter. Ingen användning med elevuppgifter före skolans godkännande.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script src="login.js"></script></body></html>
