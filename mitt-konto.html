<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitt konto | Lärarverktyget</title><link rel="stylesheet" href="style.css"><style>main{max-width:620px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0 .35rem}input{display:block;width:100%;padding:.75rem;box-sizing:border-box;border:1px solid #94a3b8;border-radius:8px}.error{color:#9f1239}.success{color:#166534}</style></head>
<body><header><div class="wrap top"><div class="brand">♫ Lärarverktyget <small>Mitt konto</small></div><a href="arbetsyta.html" style="color:white">Till arbetsytan</a></div></header>
<main><section class="panel"><h1>Mitt konto</h1><p id="account">Kontrollerar inloggning…</p><div id="content" hidden><h2>Ändra lösenord</h2><p>Ange ditt nuvarande lösenord och välj ett nytt med minst 12 tecken.</p><form id="passwordForm"><label for="current">Nuvarande lösenord</label><input id="current" type="password" autocomplete="current-password" required><label for="next">Nytt lösenord</label><input id="next" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Bekräfta nytt lösenord</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="save" type="submit">Spara nytt lösenord</button></form><p id="message" role="status" aria-live="polite"></p><p>Har du glömt ditt nuvarande lösenord? <a href="login.html">Gå till inloggningen</a> och använd ”Skicka återställningslänk”.</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script src="mitt-konto.js"></script></body></html>
