<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitt quizbibliotek | Lärarverktyget</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#15274a;color:white;padding:20px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:white}main{max-width:1160px;margin:auto;padding:28px 18px}h1{margin:0 0 6px;font-size:2rem}p{color:#5b6678}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:#263b65;color:white;cursor:pointer}button.primary{background:#6244d9}button.secondary{background:#e9edf7;color:#1b3154}button.danger{background:#fff0f0;color:#a51e30}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f3ae42}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd3e2;border-radius:9px;background:white}label{display:block;font-weight:650;margin:12px 0 6px}.toolbar{display:grid;grid-template-columns:1fr 190px auto;gap:12px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px}.card,.panel{background:white;border:1px solid #e0e5ef;border-radius:16px;padding:20px;box-shadow:0 5px 20px #1b2b4b0b}.card{display:flex;flex-direction:column;gap:10px}.card h3{margin:0}.card small{color:#617089}.cover{height:96px;border-radius:12px;background:linear-gradient(135deg,#6244d9,#1796bb);display:grid;place-items:center;color:white;font-size:2.2rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:.85rem;padding:9px 11px}.hidden{display:none!important}.panel{max-width:850px;margin:18px auto}.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.q{background:#f7f8fd;border:1px solid #dce2ee;border-radius:12px;padding:15px;margin:14px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answers label{margin:0;font-weight:400}.answers input[type=radio]{width:auto}.choice{display:flex;gap:9px;align-items:center;background:white;padding:10px;border-radius:8px}.quizanswers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.quizanswers button{min-height:76px;font-size:1.1rem}.quizanswers button:nth-child(1){background:#be2b42}.quizanswers button:nth-child(2){background:#2572c6}.quizanswers button:nth-child(3){background:#b18b15}.quizanswers button:nth-child(4){background:#258b66}.quizanswers button:disabled{opacity:.65}.notice{padding:12px;background:#fff6df;border-radius:9px;color:#715212}.muted{color:#64748b}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.answers,.quizanswers{grid-template-columns:1fr}h1{font-size:1.6rem}}</style></head><body><header><strong>🎯 Lärarverktyget · Interaktiva quiz</strong><a href="index.html">← Till startsidan</a></header><main>
<section id="library"><div class="line"><div><h1>Mitt quizbibliotek</h1><p>Skapa, organisera och öva med dina egna quiz.</p></div><button class="primary" id="new">+ Skapa quiz</button></div><div class="notice">Första testversionen: dina quiz sparas lokalt i den här webbläsaren, inte i molnet. Använd export för säkerhetskopia. Lägg inte in elevuppgifter.</div><div class="toolbar"><input id="search" placeholder="Sök bland dina quiz…" aria-label="Sök quiz"><select id="subjectFilter" aria-label="Filtrera ämne"><option value="">Alla ämnen</option></select><button class="secondary" id="importBtn">Importera JSON</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div><div id="cards" class="grid"></div></section>
<section id="editor" class="hidden panel"><div class="line"><h1 id="editorHeading">Skapa quiz</h1><button class="secondary" id="backEditor">Till biblioteket</button></div><label for="title">Titel</label><input id="title" maxlength="120" placeholder="Exempel: Musikinstrument åk 6"><label for="subject">Ämne</label><input id="subject" maxlength="60" placeholder="Musik"><label for="grade">Årskurs</label><select id="grade"><option value="">Välj årskurs</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>Annat</option></select><label for="area">Arbetsområde</label><input id="area" maxlength="100" placeholder="Instrumentkunskap"><div class="line" style="margin-top:22px"><h2>Frågor</h2><button class="secondary" id="addQ">+ Lägg till fråga</button></div><div id="questionList"></div><div class="line"><button class="secondary" id="cancel">Avbryt</button><button class="primary" id="save">Spara quiz</button></div></section>
<section id="player" class="hidden panel"><div class="line"><h1 id="playTitle"></h1><button class="secondary" id="exit">Avsluta</button></div><p id="progress"></p><h2 id="prompt"></h2><div class="quizanswers" id="playAnswers"></div><p id="feedback" role="status"></p><button class="primary hidden" id="next">Nästa fråga</button></section>
</main><script src="quizbibliotek.js" defer></script></body></html>
