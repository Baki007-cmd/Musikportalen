<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital nottavla | Musikportalen</title><link rel="stylesheet" href="style.css"><style>body{background:#edf2fa}.wrapwide{max-width:1400px;margin:auto;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls label{font-weight:600}.controls select{padding:9px;border:1px solid #94a3b8;border-radius:8px}.paper{background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 14px #1122551b;overflow:auto}svg{display:block;width:100%;min-width:650px;touch-action:none;cursor:crosshair}.staffline{stroke:#1e293b;stroke-width:1.7}.note{fill:#172554;cursor:pointer}.note.selected{fill:#1d4ed8}.hint{color:#475569}#board:fullscreen{background:white;padding:25px;overflow:auto}</style></head><body><header><div class="wrap top"><div class="brand">♫ Musikportalen <small>Digital nottavla</small></div><a href="klassrumstavla.html" style="color:white">Klassrumstavla</a></div></header><main class="wrapwide" id="board"><div class="controls"><h1 style="flex:1">Nottavla</h1><label for="symbol">Symbol</label><select id="symbol"><option value="quarter">Fjärdedelsnot</option><option value="half">Halvnot</option><option value="whole">Helnot</option><option value="erase">Sudda</option></select><button id="undo" class="secondary">Ångra</button><button id="clear" class="secondary">Rensa</button><button id="fullscreen">Helskärm</button></div><p class="hint">Klicka på eller mellan notlinjerna för att sätta ut noter. Välj Sudda och klicka på en not för att ta bort den. Fungerar även på pekskärm.</p><div class="paper"><svg id="sheet" viewBox="0 0 1100 650" role="img" aria-label="Tre notsystem där du kan placera noter"></svg></div><p class="hint">Dina noter sparas lokalt i webbläsaren på den här enheten.</p></main><script src="nottavla.js"></script></body></html>
