2px;box-shadow:0 4px 14px #17255412}.tile h2{margin:0 0 12px}.tile{position:relative}.move-handle{float:right;cursor:grab;touch-action:none;background:#e2e8f0;color:#172554;border:1px solid #94a3b8;border-radius:8px;padding:5px 9px;font-size:14px}.move-handle:active{cursor:grabbing}.tile.moving{opacity:.55;outline:3px dashed #2563eb}.tiles{align-items:start}.clock,.digits{font-size:clamp(2.5rem,5vw,4rem);font-weight:800;font-variant-numeric:tabular-nums}.tile textarea{width:100%;min-height:150px;resize:vertical;padding:12px;border:1px solid #94a3b8;border-radius:10px;font:inherit}.tile input[type=number]{width:85px;padding:10px;border:1px solid #94a3b8;border-radius:8px}.lights{display:flex;gap:14px}.light{width:62px;height:62px;border-radius:50%;border:4px solid #cbd5e1;opacity:.35;cursor:pointer}.light.active{opacity:1;border-color:#172554;box-shadow:0 0 0 4px #94a3b8}.red{background:#dc2626}.yellow{background:#eab308}.green{background:#16a34a}.board:fullscreen{background:#e8eef8;overflow:auto;padding:30px}.muted{color:#475569}body:not(.editing) .move-handle,body:not(.editing) .resize-handle{display:none}body:not(.editing) #goals,body:not(.editing) #instructions{border-color:transparent;background:transparent;resize:none;cursor:default}body:not(.editing) #tiles{border-color:transparent}body:not(.editing) #newBoard,body:not(.editing) #reset,body:not(.editing) #background{display:none}body:not(.editing) label[for="background"]{display:none}.tool-choices{display:flex;gap:7px;flex-wrap:wrap}.extra-toggle[aria-pressed="true"]{background:#0f766e;color:white;border-color:#0f766e}#saveBoard{background:#166534;color:white;font-weight:700}#tiles{display:block;position:relative;min-height:920px;border:2px dashed #94a3b8;border-radius:16px;background:#ffffff20;overflow:hidden}#tiles .tile{position:absolute;width:calc(33.333% - 18px);min-width:0;margin:0;box-sizing:border-box;touch-action:auto}#tiles .move-handle{touch-action:none;user-select:none}#tiles .resize-handle{position:absolute;right:5px;bottom:5px;width:26px;height:26px;cursor:nwse-resize;touch-action:none;border:0;border-radius:6px;background:#dbeafe;color:#1e40af;font-size:20px;line-height:24px;padding:0}#tiles .tile{min-height:135px;overflow:visible}#tiles .tile textarea{overflow-y:auto}#tiles [data-tile="goals"] textarea,#tiles [data-tile="activities"] textarea{height:150px;min-height:150px;box-sizing:border-box;overflow-y:auto;resize:vertical}#tiles [data-tile="goals"] textarea,#tiles [data-tile="activities"] textarea{scrollbar-width:none;-ms-overflow-style:none}#tiles [data-tile="goals"] textarea::-webkit-scrollbar,#tiles [data-tile="activities"] textarea::-webkit-scrollbar{display:none}#tiles .tile:not([data-tile="goals"]):not([data-tile="activities"]){overflow:hidden}#tiles .tile.moving{opacity:.9;z-index:20;outline:3px solid #2563eb}#tiles .tile[hidden]{display:none!important}#tiles [data-tile="goals"] textarea,#tiles [data-tile="activities"] textarea{height:auto;min-height:260px;max-height:none;overflow:hidden;resize:none;font-size:clamp(1.15rem,1.7vw,1.5rem);line-height:1.5;white-space:pre-wrap}#tiles [data-tile="goals"],#tiles [data-tile="activities"]{min-height:350px}#tiles [data-tile="goals"] h2,#tiles [data-tile="activities"] h2{font-size:clamp(1.3rem,2vw,1.9rem)}@media(max-width:700px){#tiles .tile{width:calc(50% - 12px);padding:12px}#tiles .clock,#tiles .digits{font-size:2rem}#tiles .tile textarea{min-height:100px}} .format-bar{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}.format-bar button{padding:5px 10px;font-size:14px}.rich-editor{width:100%;min-height:260px;padding:12px;box-sizing:border-box;font-size:clamp(1.15rem,1.7vw,1.5rem);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;border:1px solid transparent;border-radius:8px}.rich-editor:empty:before{content:attr(data-placeholder);color:#64748b}.rich-editor ul{padding-left:1.4em;list-style:disc}.rich-editor p{margin:0 0 .4em}body.editing .rich-editor:focus,.rich-editor:focus{border-color:#94a3b8} .header-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;margin-left:auto;padding:10px 18px;border:1px solid #94a3b8;border-radius:10px;background:#fff;color:#172554;white-space:nowrap}.header-clock-time{font-weight:800;font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.1}.header-clock-date{font-size:.95rem;text-transform:capitalize}@media(max-width:700px){.header-clock{margin-left:0}} </style></head><body><header><div class="wrap top"><div class="brand">♫ Musikportalen <small>Digital klassrumstavla</small></div><a href="arbetsyta.html" style="color:white">Min arbetsyta</a></div></header><main class="board" id="board"><div class="toolbar"><h1 style="flex:1">Klassrumstavla</h1><label for="background">Bakgrund <select id="background" aria-label="Välj bakgrund"><option value="blue">Ljusblå</option><option value="staff">Notsystem</option><option value="white">Vit</option><option value="green">Ljusgrön</option><option value="dark">Mörkblå</option></select></label><a href="nottavla.html" target="_blank" rel="noopener" style="display:inline-block;background:#0f766e;color:white;border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none">Öppna nottavla i nytt fönster</a><label for="boardGrade">Årskurs <select id="boardGrade" aria-label="Välj årskurs"><option value="3">Åk 3</option><option value="4">Åk 4</option><option value="5">Åk 5</option><option value="6">Åk 6</option><option value="7">Åk 7</option><option value="8">Åk 8</option><option value="9">Åk 9</option></select></label><label for="boardName">Tavlans namn <input id="boardName" maxlength="100" value="Min klassrumstavla" style="padding:9px;border:1px solid #94a3b8;border-radius:8px"></label><div class="tool-choices" aria-label="Valfria verktyg"><button type="button" class="secondary extra-toggle" data-extra="timer" aria-pressed="false">Timer</button><button type="button" class="secondary extra-toggle" data-extra="quiet" aria-pressed="false">Arbetsro</button><button type="button" class="secondary extra-toggle" data-extra="metronome" aria-pressed="false">Metronom</button></div><button id="editMode" type="button" aria-pressed="false">Redigera tavlan</button><button id="saveBoard">Spara tavlan</button><button id="newBoard" class="secondary">Ny tavla</button><button id="hideExtras" type="button" class="secondary">Dölj extra verktyg</button><button id="fullscreen">Helskärm</button><button id="reset" class="secondary">Nollställ tavlan</button><div class="header-clock" aria-label="Aktuell tid"><span id="clock" class="header-clock-time">--:--</span><span id="today" class="header-clock-date"></span></div></div><div class="tiles" id="tiles"><section class="tile" data-tile="timer"><button type="button" class="move-handle" aria-label="Flytta Timer" title="Dra för att flytta">↕ Flytta</button><h2>Timer</h2><label for="minutes">Minuter</label> <input id="minutes" type="number" min="1" max="180" value="10"><div class="digits" id="countdown">10:00</div><button id="timerStart">Starta</button><button id="timerPause" class="secondary">Pausa</button><button id="timerReset" class="secondary">Återställ</button><button type="button" class="resize-handle" aria-label="Ändra storlek" title="Dra för att ändra storlek">◢</button></section><section class="tile" data-tile="goals"><button type="button" class="move-handle" aria-label="Flytta LEKTIONSMÅL" title="Dra för att flytta">↕ Flytta</button><h2>LEKTIONSMÅL</h2><div class="format-bar" role="toolbar" aria-label="Formatera text"><button type="button" data-format="bold" title="Fetstil"><b>F</b></button><button type="button" data-format="italic" title="Kursiv"><i>K</i></button><button type="button" data-format="underline" title="Understrykning"><u>U</u></button><button type="button" data-format="insertUnorderedList" title="Punktlista">• Lista</button><select class="font-size" aria-label="Textstorlek"><option value="">Storlek</option><option value="16">16</option><option value="20">20</option><option value="24">24</option><option value="28">28</option><option value="32">32</option><option value="40">40</option></select></div><div id="goals" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Vad ska vi lära oss idag?"></div><button type="button" class="resize-handle" aria-label="Ändra storlek" title="Dra för att ändra storlek">◢</button></section><section class="tile" data-tile="activities"><button type="button" class="move-handle" aria-label="Flytta AKTIVITETER" title="Dra för att flytta">↕ Flytta</button><h2>AKTIVITETER</h2><div class="format-bar" role="toolbar" aria-label="Formatera text"><button type="button" data-format="bold" title="Fetstil"><b>F</b></button><button type="button" data-format="italic" title="Kursiv"><i>K</i></button><button type="button" data-format="underline" title="Understrykning"><u>U</u></button><button type="button" data-format="insertUnorderedList" title="Punktlista">• Lista</button><select class="font-size" aria-label="Textstorlek"><option value="">Storlek</option><option value="16">16</option><option value="20">20</option><option value="24">24</option><option value="28">28</option><option value="32">32</option><option value="40">40</option></select></div><div id="instructions" class="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="1. Lyssna 2. Öva 3. Spela tillsammans"></div><button type="button" class="resize-handle" aria-label="Ändra storlek" title="Dra för att ändra storlek">◢</button></section><section class="tile" data-tile="quiet"><button type="button" class="move-handle" aria-label="Flytta Arbetsro" title="Dra för att flytta">↕ Flytta</button><h2>Arbetsro</h2><p>Välj nivå för lektionen.</p><div class="lights"><button class="light red" data-light="red" aria-label="Röd: tyst arbete" title="Tyst arbete"></button><button class="light yellow" data-light="yellow" aria-label="Gul: låg samtalsnivå" title="Låg samtalsnivå"></button><button class="light green active" data-light="green" aria-label="Grön: samarbete" title="Samarbete"></button></div><p id="lightLabel">Grön – samarbete</p><button type="button" class="resize-handle" aria-label="Ändra storlek" title="Dra för att ändra storlek">◢</button></section><section class="tile" data-tile="metronome"><button type="button" class="move-handle" aria-label="Flytta Metronom" title="Dra för att flytta">↕ Flytta</button><h2>Metronom</h2><label for="bpm">Tempo (BPM)</label> <input id="bpm" type="number" min="40" max="220" value="80"><div class="digits" id="beat">♩</div><button id="metro">Starta metronom</button><p class="muted">Klickljud och visuell puls.</p><button type="button" class="resize-handle" aria-label="Ändra storlek" title="Dra för att ändra storlek">◢</button></section></div><section class="tile"><h2>Mina sparade klassrumstavlor</h2><p id="boardStatus" role="status">Ansluter …</p><div id="savedBoards" style="display:flex;flex-wrap:wrap;gap:10px"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-client.js"></script><script src="klassrumstavla.js"></script></body></html>
