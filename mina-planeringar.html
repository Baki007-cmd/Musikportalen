<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mina planeringar | Lärarverktyget</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0 .3rem}input,textarea,select{width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #94a3b8;border-radius:7px}textarea{min-height:95px}.item{border:1px solid #cbd5e1;border-radius:8px;padding:1rem;margin:.7rem 0}.actions{display:flex;gap:.6rem;flex-wrap:wrap}.hint{font-size:.9rem;color:#475569}</style></head><body><header><div class="wrap top"><div class="brand">♫ Lärarverktyget <small>Lektionsplanering · test</small></div><a href="index.html">Startsida</a><button id="logout">Logga ut</button></div></header><main><p id="message" role="status">Kontrollerar inloggning…</p><div id="protected" hidden><section class="panel"><h1>Mina lektionsplaneringar</h1><p>Planeringarna sparas på ditt konto. Använd inga elevnamn eller känsliga uppgifter.</p><form id="lesson"><label for="title">Titel</label><input id="title" required maxlength="200"><label for="grade">Årskurs</label><select id="grade"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select><label for="subject">Ämne</label><input id="subject" value="Musik"><label for="date">Datum</label><input id="date" type="date"><label for="lgr22">Lgr22 – syfte och centralt innehåll</label><textarea id="lgr22" placeholder="Koppling till kursplanen…"></textarea><label for="goals">Lärandemål</label><textarea id="goals" placeholder="Vad ska eleverna kunna efter lektionen?"></textarea><label for="steps">Lektionsmoment</label><textarea id="steps" placeholder="Inledning, gemensam övning, eget arbete och avslutning…"></textarea><label for="assessment">Bedömning och återkoppling</label><textarea id="assessment" placeholder="Hur följer jag elevernas lärande?"></textarea><label for="reflection">Pedagogisk reflektion</label><textarea id="reflection" placeholder="Vad fungerade och vad behöver ändras?"></textarea><div class="actions"><button type="submit">Spara</button><button type="button" class="secondary" id="new">Ny planering</button></div></form></section><section class="panel"><h2>Sparade planeringar</h2><p class="hint">Planeringarna är kopplade till ditt konto.</p><div id="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script src="mina-planeringar.js"></script></body></html>
