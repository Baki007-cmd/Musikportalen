<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musikportalen – säker lärarplanerare</title><style>body{font:16px system-ui;background:#f3f6fb;color:#172554;margin:0}header{background:#172554;color:white;padding:24px}main{max-width:850px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:22px;margin-bottom:18px;border:1px solid #d9e1ef}label{display:block;margin:12px 0;font-weight:600}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:1px solid #94a3b8;border-radius:8px;font:inherit}button{background:#1d4ed8;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#475569}.warning{background:#fff2d4;padding:14px;border-left:4px solid #b45309}.item{border-top:1px solid #ddd;padding:12px 0}textarea{min-height:85px}#editor[hidden],#account[hidden],#login[hidden]{display:none}</style></head><body><header><h1>Musikportalen – lärarplanerare</h1><p>Google Workspace · personlig planering</p></header><main><p class="warning">Pilotversion. Använd enbart testkonton och påhittade uppgifter tills huvudmannen godkänt tjänsten och konfigurationen har säkerhetsgranskats.</p><section class="card"><p id="status" role="status">Laddar…</p><div id="login" hidden><button id="sign-in">Logga in med Google</button></div><div id="account" hidden><span id="user"></span> <button id="sign-out">Logga ut</button></div></section><section id="editor" class="card" hidden><h2>Min lektionsplanering</h2><form id="form"><input id="id" type="hidden"><label>Rubrik<input id="title" required maxlength="120"></label><label>Datum<input id="date" type="date" required></label><label>Årskurs<select id="grade"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label><label>Mål och Lgr22-koppling<textarea id="goals" maxlength="5000"></textarea></label><label>Lektionens upplägg<textarea id="steps" maxlength="10000"></textarea></label><label>Kognitionsvetenskaplig koppling<textarea id="theory" maxlength="5000" placeholder="Begrepp, kapitel och verifierat sidnummer"></textarea></label><label>Dokumentation och reflektion (inga elevuppgifter)<textarea id="reflection" maxlength="10000"></textarea></label><button type="submit">Spara i molnet</button><button id="reset" type="button">Ny planering</button></form><h2>Mina sparade planeringar</h2><div id="lessons"></div></section></main><script type="module" src="./app.js"></script></body></html>
