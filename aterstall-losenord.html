<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nytt lösenord</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><section class="panel"><h1>Välj nytt lösenord</h1><form id="f"><label>Nytt lösenord <input id="p" type="password" minlength="12" autocomplete="new-password" required></label><button>Spara lösenord</button></form><p id="m" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-client.js"></script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();try{const c=await getMusikportalenSupabase();const {error}=await c.auth.updateUser({password:document.getElementById("p").value});if(error)throw error;document.getElementById("m").textContent="Lösenord sparat. Du kan nu logga in."; }catch(err){document.getElementById("m").textContent=err.message;}};</script></body></html>
